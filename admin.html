<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>RE BOTTLE — Адмін-панель</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="stylesheet" href="admin.css?v=2">

    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="admin-body">

    <div class="admin-login-screen" id="loginScreen">
        <form class="admin-login-card" id="loginForm">
            <div class="logo" style="margin-bottom: 20px; justify-content: center;">
                <img src="assets/logo-mark.png" alt="RE BOTTLE" class="logo-mark-img"> RE <span class="logo-sub">BOTTLE</span>
            </div>
            <h1>Вхід в адмін-панель</h1>
            <p class="admin-login-subtitle">Тільки для власника магазину</p>

            <div class="form-group">
                <span class="field-label">Email</span>
                <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="username">
            </div>
            <div class="form-group">
                <span class="field-label">Пароль</span>
                <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="admin-login-error" id="loginError"></div>

            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket"></i> Увійти
            </button>
        </form>
    </div>

    <div class="admin-dashboard" id="dashboard" style="display: none;">
        <header class="admin-topbar">
            <div class="logo">
                <img src="assets/logo-mark.png" alt="RE BOTTLE" class="logo-mark-img"> RE <span class="logo-sub">BOTTLE</span>
                <span class="admin-badge-label">адмін</span>
            </div>
            <div class="admin-topbar-actions">
                <a href="index.html" target="_blank" class="btn btn-outline"><i class="fa-solid fa-arrow-up-right-from-square"></i> Сайт</a>
                <button type="button" class="icon-btn" id="logoutBtn" title="Вийти"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-categories-block">
                <div class="admin-categories-header">
                    <span>Категорії</span>
                    <button type="button" class="admin-row-btn" onclick="addCategoryPrompt()" title="Додати категорію"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="admin-categories-list" id="adminCategoriesList"></div>
            </div>

            <div class="section-header">
                <div>
                    <div class="section-eyebrow">Каталог</div>
                    <h2 id="productsCountTitle" style="font-size:24px;">Товари</h2>
                </div>
                <button type="button" class="btn btn-primary" onclick="openProductForm()">
                    <i class="fa-solid fa-plus"></i> Додати товар
                </button>
            </div>

            <div class="admin-products-list" id="adminProductsList">
                <div class="admin-loading"><i class="fa-solid fa-spinner fa-spin"></i> Завантаження...</div>
            </div>
        </main>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content admin-modal-content">
            <button type="button" class="close-btn" onclick="closeProductForm()"><i class="fa-solid fa-xmark"></i></button>
            <div id="productFormBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fa-solid fa-check"></i><span id="toastText"></span></div>

    <script src="admin.js?v=2"></script>
</body>
</html>
